name: Sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: natrontech

      # Checking out with the app token lets the later push bypass the ruleset as the app
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rollout: this stays on plan until the plan across all repositories was reviewed, then it becomes apply
      - name: Sync
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: node src/cli.ts plan | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit moved repository files and the inventory
        run: |
          git config user.name "natron-oss-governance[bot]"
          git config user.email "natron-oss-governance[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: update inventory" && git push)

      # GitHub only mails the last editor of this file about a failed scheduled run
      # The next successful sync closes the issue again because no problem carries its title
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --label governance --search 'in:title "Sync run failed"' --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues" -f title="Sync run failed" -f "labels[]=governance" \
              -f body="The sync run failed: $RUN_URL

          @natrontech/open-source-owners"
          fi
