name: Sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only print what would change, without changing anything
        type: boolean
        default: true
      repos:
        description: Space-separated repositories to limit the run to, empty for all
        type: string
        default: ""

permissions:
  contents: read

concurrency: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: natrontech

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rollout: only a manual run without dry run applies until the pilot succeeded, then automatic runs apply too
      - name: Sync
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && 'apply' || 'plan' }}
          REPOS: ${{ inputs.repos }}
        # Explicit bash adds pipefail, so a failing sync is not hidden behind tee
        shell: bash
        # REPOS is left unquoted on purpose so that each repository becomes its own argument
        run: node src/cli.ts "$MODE" $REPOS | tee -a "$GITHUB_STEP_SUMMARY"

      # GitHub only mails the last editor of this file about a failed scheduled run
      # The next successful sync closes the issue again because no problem carries its title
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --label governance --search 'in:title "Sync run failed"' --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues" -f title="Sync run failed" -f "labels[]=governance" \
              -f body="The sync run failed: $RUN_URL

          @natrontech/open-source-owners"
          fi
