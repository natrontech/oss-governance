name: Plan

on:
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The pre-commit hook does the same, but it does not run for web edits or skipped hooks
      - name: Validate the config against the schema
        run: pnpm generate

      - name: Check the generated files are current
        run: git diff --exit-code INVENTORY.md schemas

      # Pull requests from forks get no secrets, so the plan only runs for branches of this repository
      # The plan only reads, so the code of the pull request never holds a token that can change anything
      - name: Create read-only app token
        id: app
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: natrontech
          permission-administration: read
          permission-contents: read
          permission-issues: read
          permission-members: read
          permission-pull-requests: read

      - name: Plan
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        # Explicit bash adds pipefail, so a failing plan is not hidden behind tee
        shell: bash
        run: node src/cli.ts plan | tee plan.md "$GITHUB_STEP_SUMMARY"

      # The comment is posted by the app, with a token that is created only after the plan ran and can only comment here
      - name: Create app token for the plan comment
        id: comment
        if: always() && hashFiles('plan.md') != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: natrontech
          repositories: oss-governance
          permission-pull-requests: write

      # The marker finds the comment of earlier runs, so each pull request keeps a single plan comment
      - name: Comment the plan
        if: always() && steps.comment.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.comment.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: "<!-- oss-governance-plan -->"
        # A comment holds at most 65536 characters, which the diffs of a change to many repositories can exceed
        run: |
          body="$(cat plan.md)"
          if [ "${#body}" -gt 60000 ]; then
            body="${body:0:60000}

          The plan is cut off here, the full plan is in the summary of the workflow run."
          fi
          body="$body

          $MARKER"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "natron-oss-governance[bot]" and (.body | contains(env.MARKER))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
